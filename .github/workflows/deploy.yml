
name: Deploy Angular App to AWS 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write


jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Verify build output
        run: test -f dist/aws-deploy-2/browser/index.html

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch(
            `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com`,
            {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            }
          );

          if (!response.ok) throw new Error("Unable to retrieve OIDC token");

          const { value } = await response.json();
          const payload = JSON.parse(
            Buffer.from(value.split('.')[1], 'base64url').toString()
          );

          console.log(JSON.stringify({
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub
          }, null, 2));
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy files to S3
        run: |
          aws s3 sync dist/aws-deploy-2/browser/ s3://aws-deploy-2/ --delete

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ECD146IO50GS5 \
            --paths "/*"
